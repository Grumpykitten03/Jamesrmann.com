<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | James R Mann</title>
    <meta name="description" content="A gallery of images and work by James R Mann.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Gallery | James R Mann">
    <meta property="og:description" content="A gallery of images and work by James R Mann.">
    <meta property="og:image" content="https://jamesrmann.com/assets/favicon.svg">
    <meta property="og:url" content="https://jamesrmann.com/gallery.html">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <iframe class="header-frame" src="header.html#nav-gallery" title="Site navigation"></iframe>

    <main id="main-content">
        <h1 class="page-title reveal">Gallery</h1>
        <p class="page-subtitle reveal">Selected work and visual experiments.</p>

        <div class="gallery-grid">
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/3356MannJ_Project2_Arcane%20FX%20Magazine.jpg" data-caption="Lorem ipsum dolor sit amet, consectetur adipiscing elit." data-link="arcane-fx-magazine.html" data-link-label="View the full magazine">
                    <div class="gallery-thumb"><img src="assets/images/3356MannJ_Project2_Arcane%20FX%20Magazine.jpg" alt="Arcane FX Magazine cover design" loading="lazy"></div>
                </button>
                <figcaption>Arcane FX Magazine</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/Demon%20door%20thumbnail.png" data-caption="Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.">
                    <div class="gallery-thumb"><img src="assets/images/Demon%20door%20thumbnail.png" alt="Demon door illustration thumbnail" loading="lazy"></div>
                </button>
                <figcaption>Demon Door</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/jm%20lbum%20cover.jpg" data-caption="Duis aute irure dolor in reprehenderit in voluptate velit esse.">
                    <div class="gallery-thumb"><img src="assets/images/jm%20lbum%20cover.jpg" alt="Album cover artwork" loading="lazy"></div>
                </button>
                <figcaption>Album Cover</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/Persona%2001.jpg" data-caption="Excepteur sint occaecat cupidatat non proident, sunt in culpa.">
                    <div class="gallery-thumb"><img src="assets/images/Persona%2001.jpg" alt="Persona artwork, study one" loading="lazy"></div>
                </button>
                <figcaption>Persona I</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/Persona%202.jpg" data-caption="Qui officia deserunt mollit anim id est laborum et dolore.">
                    <div class="gallery-thumb"><img src="assets/images/Persona%202.jpg" alt="Persona artwork, study two" loading="lazy"></div>
                </button>
                <figcaption>Persona II</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/photobook.jpg" data-caption="Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit." data-link="photobook.html" data-link-label="View the full photobook">
                    <div class="gallery-thumb"><img src="assets/images/photobook.jpg" alt="Photobook cover design" loading="lazy"></div>
                </button>
                <figcaption>Photobook</figcaption>
            </figure>
        </div>
    </main>

    <div class="lightbox" id="gallery-lightbox" hidden role="dialog" aria-modal="true" aria-label="Enlarged image">
        <div class="lightbox-content">
            <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
            <img id="lightbox-image" src="" alt="">
            <p class="lightbox-caption" id="lightbox-caption"></p>
            <a class="btn lightbox-link" id="lightbox-link" href="#" hidden>View full project &rarr;</a>
        </div>
    </div>

    <div id="contact"></div>
    <iframe class="footer-frame" src="footer.html" title="Site footer" loading="lazy"></iframe>
    <script src="assets/js/main.js" defer></script>
</body>
</html>
