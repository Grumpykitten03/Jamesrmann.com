<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | James R Mann</title>
    <meta name="description" content="A gallery of images and work by James R Mann.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Gallery | James R Mann">
    <meta property="og:description" content="A gallery of images and work by James R Mann.">
    <meta property="og:image" content="https://jamesrmann.com/assets/favicon.svg">
    <meta property="og:url" content="https://jamesrmann.com/gallery.html">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <iframe class="header-frame" src="header.html#nav-gallery" title="Site navigation"></iframe>

    <main id="main-content">
        <h1 class="page-title reveal">Gallery</h1>
        <p class="page-subtitle reveal">Selected work and visual experiments.</p>

        <div class="gallery-grid">
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/OG%20Watermark%20-%20ETP%20.PNG" data-caption="Short-form videos produced for Enough Talk, a Texas-based platform that promotes local businesses and artists." data-link="EnoughTalk.html" data-link-label="View Enough Talk videos">
                    <div class="gallery-thumb"><img src="assets/images/OG%20Watermark%20-%20ETP%20.PNG" alt="Enough Talk logo" loading="lazy"></div>
                </button>
                <figcaption>Enough Talk</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/3356MannJ_Project2_Arcane%20FX%20Magazine.jpg" data-caption="A mock magizine made for educational purposes. Based on the tabletop game D&D 5E, this magazine showcases some of my homebrew content for the game; including custom monsters and and setting details. I used Adobe indesign to compile and arrange the content, utilizing various EPublishing tools and techniques to achieve the final layout. Visit the project page to download the full PDF magazine." data-link="arcane-fx-magazine.html" data-link-label="View the full magazine">
                    <div class="gallery-thumb"><img src="assets/images/3356MannJ_Project2_Arcane%20FX%20Magazine.jpg" alt="Arcane FX Magazine cover design" loading="lazy"></div>
                </button>
                <figcaption>Arcane FX Magazine</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/Demon%20door%20thumbnail.png" data-caption="This short, 30 second animation is based off of a famously unfair and punished adventure in an early version of D&D. I combined digital 2D and 3D animation techniques to create the final product. Made in blender, this was meant as a simple test to see how the grease pencil tool could integrate into larger 3D scenes. Overall, it was a fun experiment in blending different animation styles. Visit the project page to view the full animation." data-link="https://www.youtube.com/watch?v=ST4-B5JVjxo" data-link-label="Watch the full animation">
                    <div class="gallery-thumb"><img src="assets/images/Demon%20door%20thumbnail.png" alt="Demon door illustration thumbnail" loading="lazy"></div>
                </button>
                <figcaption>Demon Door</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/jm%20lbum%20cover.jpg" data-caption="Album cover artwork made for my friends' music project: Rearview Mindset. I used Adobe Photoshop and Illustrator to create the initial sketches and final desin by hand. The final product shows my artistic style and attention to detail in translating the musical themes into visual form.">
                    <div class="gallery-thumb"><img src="assets/images/jm%20lbum%20cover.jpg" alt="Album cover artwork" loading="lazy"></div>
                </button>
                <figcaption>Album Cover</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/Persona%2001.jpg" data-caption="These personas were created for a fictional company in conjunction with my peers, Christian Garcia and Eniola Obajemu. In this project we analyzed real interviews with aquantences to develop accurate and relatable personas. The goal was to create personas that could guide design decisions and ensure the final product met the hypothetical users needs effectively. The design of the persona images is entirely my own.">
                    <div class="gallery-thumb"><img src="assets/images/Persona%2001.jpg" alt="Persona artwork, study one" loading="lazy"></div>
                </button>
                <figcaption>Persona I</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/Persona%202.jpg" data-caption="The second persona in the set. While developing these personas, we analyzed the real interviews and split them into two clusters. This persona focuses on the needs and behaviors of one specific user group; dog moms, or pet parents. Personas like this would be used in any kind of marketing campaign to direct marketing efforts towards the appropriate audience.">
                    <div class="gallery-thumb"><img src="assets/images/Persona%202.jpg" alt="Persona artwork, study two" loading="lazy"></div>
                </button>
                <figcaption>Persona II</figcaption>
            </figure>
            <figure class="gallery-item reveal">
                <button class="gallery-link" type="button" data-full-src="assets/images/photobook.jpg" data-caption="Photos taken during the Fall of 2023, the images showcase scenes from my daily life. Compiled in Adobe Lightroom as an experiment in visual blocking with photographs." data-link="photobook.html" data-link-label="View the full photobook">
                    <div class="gallery-thumb"><img src="assets/images/photobook.jpg" alt="Photobook cover design" loading="lazy"></div>
                </button>
                <figcaption>Photobook</figcaption>
            </figure>
        </div>
    </main>

    <div class="lightbox" id="gallery-lightbox" hidden role="dialog" aria-modal="true" aria-label="Enlarged image">
        <div class="lightbox-content">
            <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
            <img id="lightbox-image" src="" alt="">
            <p class="lightbox-caption" id="lightbox-caption"></p>
            <a class="btn lightbox-link" id="lightbox-link" href="#" hidden>View full project &rarr;</a>
        </div>
    </div>

    <div id="contact"></div>
    <iframe class="footer-frame" src="footer.html" title="Site footer" loading="lazy"></iframe>
    <script src="assets/js/main.js" defer></script>
</body>
</html>
