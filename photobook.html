<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobook | James R Mann</title>
    <meta name="description" content="Page-by-page look at the Photobook project by James R Mann.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Photobook | James R Mann">
    <meta property="og:description" content="Page-by-page look at the Photobook project by James R Mann.">
    <meta property="og:image" content="https://jamesrmann.com/assets/images/photobook.jpg">
    <meta property="og:url" content="https://jamesrmann.com/photobook.html">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <iframe class="header-frame" src="header.html#nav-gallery" title="Site navigation"></iframe>

    <main id="main-content">
        <h1 class="page-title reveal">Photobook</h1>
        <p class="page-subtitle reveal">Swipe through every page of the photobook.</p>

        <section class="hero-carousel full-image reveal" aria-roledescription="carousel" aria-label="Photobook pages">
            <div class="carousel-viewport">
                <ul class="carousel-track">
                    <li class="carousel-slide" aria-hidden="false"><img src="assets/images/photobook/photobookpage.jpg" alt="Photobook, page 1" loading="eager"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage2.jpg" alt="Photobook, page 2" loading="lazy"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage3.jpg" alt="Photobook, page 3" loading="lazy"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage4.jpg" alt="Photobook, page 4" loading="lazy"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage5.jpg" alt="Photobook, page 5" loading="lazy"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage6.jpg" alt="Photobook, page 6" loading="lazy"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage7.jpg" alt="Photobook, page 7" loading="lazy"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage8.jpg" alt="Photobook, page 8" loading="lazy"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage9.jpg" alt="Photobook, page 9" loading="lazy"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage10.jpg" alt="Photobook, page 10" loading="lazy"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage11.jpg" alt="Photobook, page 11" loading="lazy"></li>
                    <li class="carousel-slide" aria-hidden="true"><img src="assets/images/photobook/photobookpage12.jpg" alt="Photobook, page 12" loading="lazy"></li>
                </ul>
            </div>
            <button class="carousel-btn prev" type="button" aria-label="Previous page">&#10094;</button>
            <button class="carousel-btn next" type="button" aria-label="Next page">&#10095;</button>
            <div class="carousel-dots" role="tablist" aria-label="Choose page to display">
                <button class="carousel-dot" type="button" role="tab" aria-selected="true" aria-label="Page 1"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 2"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 3"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 4"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 5"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 6"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 7"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 8"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 9"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 10"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 11"></button>
                <button class="carousel-dot" type="button" role="tab" aria-selected="false" aria-label="Page 12"></button>
            </div>
        </section>

        <p class="back-link reveal"><a href="gallery.html">&larr; Back to gallery</a></p>
    </main>

    <div id="contact"></div>
    <iframe class="footer-frame" src="footer.html" title="Site footer" loading="lazy"></iframe>
    <script src="assets/js/main.js" defer></script>
</body>
</html>
